<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16202B" />
    <!-- added to the home screen it opens chromeless, like an app (CC-6).
         Both spellings: iOS still only reads the apple- one, Chrome warns on it. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Command Center" />
    <!-- inline so there's no /favicon.ico round trip (and no 404) — the radar
         dial from the masthead logo, flat -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2316202B'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%236B4FA1' stroke-width='2'/%3E%3Cpath d='M32 32 L32 5 A27 27 0 0 1 55.4 18.5 Z' fill='%238F7BC4'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%23F4F6F8'/%3E%3C/svg%3E" />
    <title>Project Command Center</title>
    <style>
      body { margin: 0; -webkit-text-size-adjust: 100%; }
      @keyframes pccPulse { 0% { opacity: 1; } 50% { opacity: 0.55; } 100% { opacity: 1; } }
      /* iOS zooms the whole page when a control with text under 16px takes
         focus, and never zooms back out. The desk's controls are 10-12px by
         design, so on touch screens only they get bumped to the threshold.
         !important because those sizes are set inline in App.jsx. */
      @media (pointer: coarse) and (max-width: 860px) {
        input, select, textarea { font-size: 16px !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
